<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aranxita · Lo que me gusta de ti</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@500;600&display=swap">
<style>
:root{--ink:#020b2e;--navy:#06185e;--blue:#0a3cff;--cyan:#3df2ff;--ice:#e9fdff;--pink:#ff3fa4;
--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:Barlow,system-ui,sans-serif;
--heart:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21C4 15 1 11 1 7.5A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 11 1.5C23 11 20 15 12 21Z"/></svg>')}
*{box-sizing:border-box}
html{background:var(--ink);color:var(--ice);font-family:var(--body);overflow-x:hidden}
body{margin:0;min-height:100dvh;overflow-x:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr)}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse 70% 80% at 32% 48%,#0a3cff 0,#06185e 45%,#020b2e 85%)}
.sky::before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(-62deg,transparent 0 46px,rgba(61,242,255,.06) 46px 48px)}
.sky b{position:absolute;display:block;transform:skewX(-24deg);translate:calc(var(--x,0)*var(--d)*1px) calc(var(--y,0)*var(--d)*1px)}
.sky b:nth-of-type(1){--d:-10;left:-6%;top:-10%;width:22%;height:130%;background:linear-gradient(#0a3cff,#020b2e);opacity:.55}
.sky b:nth-of-type(2){--d:14;left:44%;top:-10%;width:3%;height:130%;background:var(--cyan);opacity:.35}
.sky b:nth-of-type(3){--d:-18;left:50%;top:60%;width:40%;height:9%;background:var(--pink);opacity:.22}
.sp{position:absolute;bottom:-6%;left:var(--l);width:var(--s);height:var(--s);background:var(--c);rotate:45deg;opacity:0;animation:up var(--t) linear var(--w) infinite}
.sp.h{rotate:0deg;-webkit-mask:var(--heart) center/contain no-repeat;mask:var(--heart) center/contain no-repeat}
@keyframes up{0%{translate:0 0;opacity:0}12%{opacity:.85}85%{opacity:.5}100%{translate:var(--dx) -118dvh;opacity:0}}
.stage{height:100dvh;display:grid;place-items:center;position:relative;min-height:0;overflow:hidden}
.moon,.fig{grid-area:1/1}
.moon{width:min(94%,78dvh);aspect-ratio:1;translate:calc(var(--x,0)*8px) calc(var(--y,0)*8px);overflow:visible}
.ring{animation:tick 60s steps(60) infinite;transform-origin:0 0}
@keyframes tick{to{transform:rotate(360deg)}}
.fig{height:95%;aspect-ratio:1104/1760;translate:calc(var(--x,0)*-14px) calc(var(--y,0)*-8px);animation:in-fig 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes in-fig{from{opacity:0;clip-path:polygon(0 0,0 0,-30% 100%,-30% 100%)}to{opacity:1;clip-path:polygon(0 0,140% 0,110% 100%,-30% 100%)}}
.fig svg{display:block;width:100%;height:100%;overflow:visible;cursor:pointer;filter:drop-shadow(-2px -1px 0 var(--cyan)) drop-shadow(14px 10px 0 rgba(10,60,255,.55));animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) scale(1.004)}}
.ap{transform-origin:0 0}
.lash{opacity:0}
@keyframes open{0%,44%,49%,100%{transform:scaleY(1);opacity:1}45.5%,46.3%{transform:scaleY(.025);opacity:0}}
@keyframes lash{0%,44%,49%,100%{opacity:0}45.5%,46.3%{opacity:1}}
.panel{position:relative;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:5vh clamp(28px,5vw,72px) 5vh 8vw;min-height:100dvh}
.panel::before{content:"";position:absolute;inset:0 -10vw 0 0;background:rgba(2,11,46,.86);border-left:4px solid var(--cyan);transform:skewX(-7deg);transform-origin:top;z-index:-1;box-shadow:-14px 0 0 rgba(10,60,255,.5);animation:in-bar .7s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes in-bar{from{translate:60% 0;opacity:0}}
h1{margin:0;font:italic 900 clamp(60px,7.4vw,120px)/.82 var(--disp);color:#fff;text-shadow:5px 5px 0 var(--blue);animation:in-t .6s .3s cubic-bezier(.2,.8,.2,1) both}
.tag{align-self:flex-start;margin:0;padding:6px 26px 6px 18px;background:var(--cyan);color:var(--ink);font:italic 800 24px/1 var(--disp);transform:skewX(-14deg);animation:in-t .6s .4s cubic-bezier(.2,.8,.2,1) both}
.tag span{display:block;transform:skewX(14deg)}
@keyframes in-t{from{translate:70px 0;opacity:0}}
ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
li{animation:in-t .55s calc(.5s + var(--i)*70ms) cubic-bezier(.2,.8,.2,1) both}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:min(100%,430px);padding:10px 24px 10px 20px;background:var(--navy);color:#8ff6ff;font:italic 800 clamp(26px,3.3dvh,34px)/1.05 var(--disp);transform:skewX(-12deg);translate:0 0;transition:translate .18s,background .18s,color .18s,box-shadow .18s;border-left:6px solid var(--blue)}
.item span{display:block;transform:skewX(12deg)}
.item:hover{background:#0b2a9a}
.item[aria-pressed=true]{translate:26px 0;background:var(--ice);color:var(--ink);border-left-color:var(--pink);box-shadow:-8px 7px 0 #1fd1ff}
.item:focus-visible{outline:3px solid #fff;outline-offset:3px}
.detail{width:min(100%,470px);padding:16px 20px 18px;border:2px solid var(--cyan);background:rgba(10,60,255,.18);transform:skewX(-5deg);min-height:104px}
.detail p{margin:0;transform:skewX(5deg);font:600 17px/1.55 var(--body);max-width:44ch}
.detail.sw p{animation:wipe .35s ease-out}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);opacity:.2}}
.foot{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.btn{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:9px 26px;background:var(--pink);color:#fff;font:italic 800 22px/1.2 var(--disp);transform:skewX(-14deg);box-shadow:5px 5px 0 var(--ink)}
.btn:active{translate:3px 3px;box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hint{font-size:14px;color:#8fd8ea}
@keyframes glint{0%,86%,100%{transform:scale(0) rotate(0);opacity:0}92%{transform:scale(1) rotate(45deg);opacity:1}97%{transform:scale(.3) rotate(90deg);opacity:.4}}
.gl{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:glint 6s ease-out infinite}
.bub{position:absolute;left:0;top:0;pointer-events:none;will-change:translate}
.bub i{display:block;border-radius:50%;width:var(--s);height:var(--s);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 7%,transparent 9%),radial-gradient(circle at 68% 72%,rgba(255,255,255,.35) 0 6%,transparent 8%),radial-gradient(circle,rgba(61,242,255,0) 52%,rgba(61,242,255,.28) 70%,rgba(255,63,164,.3) 92%,rgba(233,253,255,.7) 100%);box-shadow:inset 0 0 8px rgba(233,253,255,.25),0 0 10px rgba(61,242,255,.18)}
.bub.f{pointer-events:auto;cursor:pointer;z-index:3}
.bub.f i{width:calc(var(--s) + 14px);height:calc(var(--s) + 14px);margin:-7px}
.pop{position:absolute;border:3px solid var(--ice);border-radius:50%;pointer-events:none;z-index:3;animation:popr .45s ease-out forwards}
@keyframes popr{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0;border-width:0}}
.moon circle:nth-of-type(2){animation:pulse 4.2s ease-in-out infinite;transform-origin:0 0}
@keyframes pulse{50%{opacity:.8}}
/* Native scrolling, visually shared with the surrounding experience. */
*{scrollbar-width:thin;scrollbar-color:#65ccd9 #061632}
@supports selector(::-webkit-scrollbar){html,html *{scrollbar-width:auto!important;scrollbar-color:auto!important}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#061632}::-webkit-scrollbar-thumb{border:3px solid #061632;border-radius:30px;background:linear-gradient(#d4faff,#65ccd9);min-height:42px}::-webkit-scrollbar-thumb:hover{background:#d4faff}}
.item{border-radius:5px;transition:translate .35s cubic-bezier(.22,1,.36,1),background .25s,color .25s,box-shadow .3s}
.detail{border-width:1px;border-color:#8ef5ff80;border-radius:8px;background:linear-gradient(120deg,#123d7d45,#06185e80);box-shadow:0 8px 30px #000a2420}
.btn{border-radius:6px;transition:translate .25s,background .25s,box-shadow .25s}
.btn:hover{background:#ec4eaa;box-shadow:5px 5px 0 var(--ink),0 0 25px #ff3fa420}
html.off *{animation-play-state:paused!important}
@media(max-width:820px){body{grid-template-columns:1fr}.stage{height:76svh}.panel{min-height:0;padding:34px 22px 56px;margin-top:-4svh}.panel::before{inset:0 -20px;transform:none;border-left:0;border-top:4px solid var(--cyan);box-shadow:0 -10px 0 rgba(10,60,255,.5)}.item[aria-pressed=true]{translate:12px 0}.hint{display:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><b></b><b></b><b></b></div>
<main class="stage" aria-label="Ilustración de Aranxita">
<svg class="moon" viewBox="-330 -330 660 660" aria-hidden="true">
<defs><radialGradient id="mo" cx=".38" cy=".34" r=".75"><stop stop-color="#f4ffff"/><stop offset=".55" stop-color="#8fe9ff"/><stop offset="1" stop-color="#1b8cff"/></radialGradient></defs>
<circle r="330" fill="#3df2ff" opacity=".07"/><circle r="215" fill="url(#mo)"/>
<g fill="#2a8fe0" opacity=".28"><circle cx="-70" cy="-60" r="46"/><circle cx="80" cy="50" r="64"/><circle cx="-20" cy="120" r="30"/><circle cx="110" cy="-100" r="24"/></g>
<g class="ring" id="ring" stroke="#3df2ff"><circle r="250" fill="none" stroke-width="2.5"/><circle r="236" fill="none" stroke-width="1" stroke-dasharray="3 9" opacity=".6"/></g>
<g id="num" fill="#e9fdff" font-family="Barlow Condensed,Impact,sans-serif" font-style="italic" font-weight="800" font-size="25" text-anchor="middle" dominant-baseline="central"></g>
</svg>
<div class="fig"><svg viewBox="-40 -110 1104 1760" role="img" aria-label="Aranxita, con lentes y el pelo oscuro lleno de destellos azules y rosas, sentada en el aire" id="char">
<defs><image id="pic" href="%%PIC%%" width="1024" height="1536"/>%%DEFS%%
<linearGradient id="swg"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="sweep" maskUnits="userSpaceOnUse" x="-40" y="-110" width="1104" height="1760"><rect x="-500" y="-200" width="300" height="1900" fill="url(#swg)" transform="skewX(-20)"><animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;1900 0;1900 0" keyTimes="0;.45;1" dur="8s" repeatCount="indefinite"/></rect></mask><mask id="mont" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1536"><path d="M420 236Q444 253 472 248" fill="none" stroke="#fff" stroke-width="3"/></mask></defs>
<g>%%COMP%%</g>
<use href="#pic"/>
%%HAIR%%
<use href="#seams"/>
%%EYES%%
<use href="#pic" mask="url(#mont)"/>
<g transform="translate(432 190)"><path class="gl" d="M0-15C1-5 5-1 15 0 5 1 1 5 0 15-1 5-5 1-15 0-5-1-1-5 0-15Z" fill="#fff"/></g><g transform="translate(346 262)"><path class="gl" style="animation-delay:-3s" d="M0-11C1-4 4-1 11 0 4 1 1 4 0 11-1 4-4 1-11 0-4-1-1-4 0-11Z" fill="#cffcff"/></g><g transform="translate(530 184)"><path class="gl" style="animation-delay:-1.5s" d="M0-9C1-3 3-1 9 0 3 1 1 3 0 9-1 3-3 1-9 0-3-1-1-3 0-9Z" fill="#ffd3ee"/></g>
</svg></div>
</main>
<section class="panel" aria-label="Lo que me gusta de ti">
<h1>Aranxita</h1>
<p class="tag"><span>Lo que me gusta de ti</span></p>
<ul id="menu"></ul>
<div class="detail" id="detail" aria-live="polite"><p id="txt"></p></div>
<div class="foot"><span class="hint">Usa ↑ ↓ para elegir</span></div>
</section>
<script>
// Edita aquí los textos: [título, descripción]
const GUSTOS=[
["Tu mirada","Cuando me miras por encima de los lentes, el mundo entero se queda en silencio."],
["Tu pelo","Negro, interminable, con destellos azules y rosas. Podría perderme ahí dentro."],
["Tu estilo","Elegante y oscura, como una hora escondida que solo existe para nosotros."],
["Tu sonrisa","Labios rojos y una sonrisa que siempre llega un segundo antes de que lo notes."],
["Estar contigo","No importa dónde sea. Contigo hasta la medianoche se siente como mi lugar favorito."]];
const NS="http://www.w3.org/2000/svg",$=s=>document.querySelector(s),root=document.documentElement;
const reduce={matches:false};
if(window.parent!==window){
root.classList.add("embedded");
const panel=$(".panel"),inside=document.createElement("div");inside.className="embedded-panel-scroll";
inside.append(...panel.children);panel.append(inside);
const style=document.createElement("style");style.textContent=`
.embedded .embedded-panel-scroll{display:contents}
.embedded #blink,.embedded .item{scroll-margin-bottom:calc(var(--music-clearance,0px) + 20px)}
@media(min-width:821px){
.embedded .panel{height:100dvh;min-height:0;padding:0;display:block}
.embedded .embedded-panel-scroll{height:calc(100dvh - var(--music-clearance,0px));min-height:90px;overflow:auto;display:flex;flex-direction:column;justify-content:safe center;gap:22px;padding:5vh clamp(28px,5vw,72px) 5vh 8vw;scrollbar-width:thin}
.embedded .embedded-panel-scroll>*{flex-shrink:0}
.embedded #blink,.embedded .item{scroll-margin-bottom:20px}
}
@media(max-width:820px){.embedded .panel{padding-bottom:calc(56px + var(--music-clearance,0px))}}
@media(min-width:821px) and (max-width:1024px) and (orientation:landscape){.embedded .embedded-panel-scroll{height:100dvh}}
`;document.head.append(style);
}
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.append(e);return e};
// Reloj lunar
for(let i=0;i<60;i++){const r=i%5?8:20,c=Math.cos(i*Math.PI/30),s=Math.sin(i*Math.PI/30);mk("line",{x1:250*c,y1:250*s,x2:(250+r)*c,y2:(250+r)*s,"stroke-width":i%5?1:3},$("#ring"))}
["XII","I","II","III","IV","V","VI","VII","VIII","IX","X","XI"].forEach((n,i)=>{const a=(i-3)*Math.PI/6;mk("text",{x:292*Math.cos(a),y:292*Math.sin(a)},$("#num")).textContent=n});
// Menú
const menu=$("#menu"),txt=$("#txt"),det=$("#detail");
GUSTOS.forEach((g,i)=>{const li=document.createElement("li");li.style.setProperty("--i",i);li.innerHTML='<button class="item" type="button"><span></span></button>';li.firstChild.firstChild.textContent=g[0];li.firstChild.onclick=()=>pick(i);menu.append(li)});
const items=[...menu.querySelectorAll(".item")];
function pick(i,focus){items.forEach((b,j)=>b.setAttribute("aria-pressed",j===i));txt.textContent=GUSTOS[i][1];det.classList.remove("sw");void det.offsetWidth;det.classList.add("sw");if(focus)items[i].focus();if(window.parent!==window)window.parent.postMessage({type:"nightfall:gustos-selection",index:i},location.origin)}
menu.addEventListener("keydown",e=>{const k={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key];if(!k)return;e.preventDefault();const c=items.findIndex(b=>b.getAttribute("aria-pressed")==="true");pick((c+k+items.length)%items.length,true)});
pick(0);
// Partículas: rombos cian y corazones rosas
const sky=$(".sky");const _=0;
for(let i=0;i<16;i++){const p=document.createElement("i"),h=i%4===0;p.className="sp"+(h?" h":"");p.style.cssText=`--l:${Math.random()*100}%;--s:${h?14+Math.random()*10:5+Math.random()*7}px;--c:${h?"#ff3fa4":"#3df2ff"};--t:${9+Math.random()*9}s;--w:${-Math.random()*14}s;--dx:${(Math.random()-.5)*90}px`;sky.append(p)}
// Parallax suave
let tx=0,ty=0,cx=0,cy=0,raf=0;
let embeddedPaused=false;
function loop(){if(reduce.matches||document.hidden||embeddedPaused){raf=0;return}cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;root.style.setProperty("--x",cx.toFixed(3));root.style.setProperty("--y",cy.toFixed(3));raf=Math.abs(tx-cx)+Math.abs(ty-cy)>.002?requestAnimationFrame(loop):0}
addEventListener("pointermove",e=>{if(reduce.matches||document.hidden||embeddedPaused)return;tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1;if(!raf)raf=requestAnimationFrame(loop)});
// Parpadeo
const run=new Set();
function blink(){if(reduce.matches||document.hidden||embeddedPaused)return;run.forEach(a=>a.cancel());run.clear();
document.querySelectorAll("#char .ap,#char .lash").forEach(el=>{const l=el.classList.contains("lash");
const a=el.animate(l?[{opacity:0},{opacity:1,offset:.35},{opacity:1,offset:.55},{opacity:0}]:[{transform:"scaleY(1)",opacity:1},{transform:"scaleY(.025)",opacity:0,offset:.35},{transform:"scaleY(.025)",opacity:0,offset:.55},{transform:"scaleY(1)",opacity:1}],{duration:310,easing:"ease-in-out"});run.add(a)})}
const later=()=>setTimeout(()=>{blink();if(Math.random()<.25)setTimeout(blink,420);later()},2200+Math.random()*3200);later();
let bubbleEpoch=0;
function bubbles(box,n,front){const epoch=bubbleEpoch;
const go=()=>{if(reduce.matches||epoch!==bubbleEpoch)return;const R=box.getBoundingClientRect(),H=R.height||innerHeight,W=R.width||innerWidth,s=front?16+Math.random()*34:6+Math.random()*16,x=Math.random()*(W-s-24),dx=(Math.random()-.5)*120,d=(front?9:13)+Math.random()*10;
const b=document.createElement("div");b.className="bub"+(front?" f":"");b.style.setProperty("--s",s+"px");b.innerHTML="<i></i>";box.append(b);
const rise=b.animate([{translate:`${x}px ${H+30}px`,opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.85},{translate:`${x+dx}px -${s+30}px`,opacity:0}],{duration:d*1000,easing:"linear"});
const w=b.firstChild.animate([{transform:"translateX(-14px)"},{transform:"translateX(14px)"}],{duration:2200+Math.random()*2200,direction:"alternate",iterations:Infinity,easing:"ease-in-out"});
if(document.hidden||embeddedPaused){rise.pause();w.pause()}
rise.onfinish=()=>{w.cancel();b.remove();go()};
if(front)b.onclick=e=>{const r=b.getBoundingClientRect(),q=box.getBoundingClientRect(),p=document.createElement("div");p.className="pop";p.style.cssText=`left:${r.left-q.left}px;top:${r.top-q.top}px;width:${r.width}px;height:${r.height}px`;box.append(p);setTimeout(()=>p.remove(),460);rise.onfinish=null;rise.cancel();w.cancel();b.remove();setTimeout(go,600)}};
for(let i=0;i<n;i++)setTimeout(go,Math.random()*d0)}
const d0=3200;if(!reduce.matches){bubbles($(".sky"),12,false);bubbles($(".stage"),9,true)}
function syncMotion(){const paused=reduce.matches||document.hidden||embeddedPaused;root.classList.toggle("off",document.hidden||embeddedPaused);
if(paused){cancelAnimationFrame(raf);raf=0;run.forEach(a=>a.cancel());run.clear()}
if(reduce.matches){tx=ty=cx=cy=0;root.style.setProperty("--x",0);root.style.setProperty("--y",0)}
$("#char")[paused?"pauseAnimations":"unpauseAnimations"]();if(reduce.matches)$("#char").setCurrentTime(0);
document.querySelectorAll(".bub").forEach(b=>b.getAnimations({subtree:true}).forEach(a=>paused?a.pause():a.play()))}
document.addEventListener("visibilitychange",syncMotion);
syncMotion();
// Bridge only to the menu that owns this same-origin scene. The standalone
// composition and its smaller original typography remain unchanged.
addEventListener("message",event=>{if(event.source!==window.parent||event.origin!==location.origin||event.data?.type!=="nightfall:gustos-state")return;
if(typeof event.data.paused==="boolean")embeddedPaused=event.data.paused;
if(typeof event.data.clearance==="number"&&Number.isFinite(event.data.clearance))root.style.setProperty("--music-clearance",Math.max(0,event.data.clearance)+"px");
if(Number.isInteger(event.data.index)&&event.data.index>=0&&event.data.index<GUSTOS.length)pick(event.data.index);
syncMotion()});
document.addEventListener("keydown",event=>{if(window.parent===window)return;
if(event.key==="Escape"){event.preventDefault();window.parent.postMessage({type:"nightfall:gustos-exit"},location.origin)}
if(event.key==="Tab"){const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first||!event.shiftKey&&document.activeElement===last){event.preventDefault();window.parent.postMessage({type:"nightfall:gustos-focus",direction:event.shiftKey?"previous":"next"},location.origin)}}});
</script>
</body>
</html>
